<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>平行四边形作高求边与垂直证明</title>
<style>/* LectureScene 播放器样式:板书配色(纸白 / 墨黑 / 板书蓝 / 红笔 / 石墨灰 / 深字幕条) */
.ls-player {
  --ls-paper: #fbfaf7;
  --ls-ink: #1f2328;
  --ls-blue: #1d4ed8;
  --ls-red: #c8102e;
  --ls-grey: #6b7280;
  --ls-line: #e5e7eb;
  --ls-bar: #2b2f36;
  --ls-bar-text: #f5f5f4;
  position: relative;
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  min-height: 560px;
  background: var(--ls-paper);
  color: var(--ls-ink);
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 8px 24px rgba(0, 0, 0, 0.06);
}
.ls-head { flex: none; display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-bottom: 1px solid var(--ls-line); }
.ls-title { font-weight: 800; font-size: 16px; }
.ls-step-label { color: var(--ls-grey); font-size: 13px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ls-dots { display: flex; gap: 6px; }
.ls-dot { width: 26px; height: 26px; border-radius: 999px; border: 1.5px solid var(--ls-line); background: #fff; color: var(--ls-grey); font-size: 12px; font-weight: 700; cursor: pointer; }
.ls-dot.is-done { border-color: var(--ls-blue); color: var(--ls-blue); }
.ls-dot.is-current { background: var(--ls-blue); border-color: var(--ls-blue); color: #fff; }
.ls-stage { position: relative; flex: 1 1 auto; min-height: 0; }
.ls-stage svg { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; }
.ls-hint { flex: none; min-height: 0; max-height: 0; overflow: hidden; padding: 0 18px; font-size: 13.5px; color: var(--ls-ink); transition: max-height 0.25s ease, padding 0.25s ease; }
.ls-hint.is-visible { max-height: 60px; padding: 8px 18px; }
.ls-hint.is-play { background: #eef2ff; color: #1e3a8a; }
.ls-hint.is-info { background: #f3f4f6; color: var(--ls-grey); }
.ls-hint.is-done { background: #ecfdf5; color: #065f46; }
.ls-subtitle { flex: none; position: relative; background: var(--ls-bar); color: var(--ls-bar-text); padding: 12px 18px 14px; min-height: 56px; }
.ls-subtitle-text { font-size: 16px; line-height: 1.6; }
.ls-progress { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255, 255, 255, 0.12); }
.ls-progress-fill { height: 100%; width: 0; background: #93c5fd; transition: width 0.12s linear; }
.ls-controls { flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: #fff; border-top: 1px solid var(--ls-line); }
.ls-controls-right { margin-left: auto; display: flex; gap: 8px; }
.ls-btn { border: 1.5px solid var(--ls-line); background: #fff; color: var(--ls-ink); border-radius: 10px; padding: 8px 14px; font-size: 13.5px; font-weight: 600; cursor: pointer; min-height: 38px; }
.ls-btn:hover:not(:disabled) { border-color: var(--ls-grey); }
.ls-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.ls-btn-play { background: var(--ls-blue); border-color: var(--ls-blue); color: #fff; min-width: 120px; }
.ls-btn-play:hover:not(:disabled) { background: #1e40af; }
.ls-btn-next { border-color: var(--ls-blue); color: var(--ls-blue); }
.ls-player[data-state='waiting'] .ls-btn-next { background: var(--ls-blue); color: #fff; animation: ls-glow 1.8s ease-in-out infinite; }
@keyframes ls-glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(29, 78, 216, 0); } 50% { box-shadow: 0 0 0 6px rgba(29, 78, 216, 0.25); } }
.ls-btn-primary { background: var(--ls-blue); border-color: var(--ls-blue); color: #fff; }

/* 动手环节:探索任务条(hint 下方一条,不遮场景;点一条划一条) */
.ls-tasks { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 18px; background: #fffbeb; border-top: 1px solid #fde68a; }
.ls-tasks-title { font-size: 12px; font-weight: 800; letter-spacing: 0.06em; color: #92400e; margin-right: 2px; }
.ls-task { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #fde68a; background: #fff; padding: 4px 10px; font-size: 12.5px; line-height: 1.4; color: var(--ls-ink); cursor: pointer; border-radius: 999px; }
.ls-task:hover { border-color: #f59e0b; }
.ls-task-mark { flex: none; font-weight: 800; color: var(--ls-grey); }
.ls-task.is-done { color: var(--ls-grey); text-decoration: line-through; }
.ls-task.is-done .ls-task-mark { color: #059669; }

/* 手柄:锁定时隐藏,开放时亮起并轻微呼吸 */
.ls-handle { cursor: grab; opacity: 0; transition: opacity 0.25s ease; pointer-events: none; }
.ls-handle.ls-handle-active, .ls-slider.ls-handle-active .ls-handle { opacity: 1; pointer-events: auto; }
.ls-handle.ls-handle-active > circle:first-child { animation: ls-breathe 1.8s ease-in-out infinite; }
@keyframes ls-breathe { 0%, 100% { r: 16; } 50% { r: 20; } }
.ls-handle.ls-dragging { cursor: grabbing; }
.ls-slider { opacity: 0.35; transition: opacity 0.25s ease; }
.ls-slider.ls-handle-active { opacity: 1; }

/* 审题页:一页 PPT 式(占满舞台,全静默):题干(三色高亮)+ 题图 + 已知/隐含/求/思路 四块 */
.ls-analysis-page { position: absolute; inset: 0; z-index: 5; background: var(--ls-paper); padding: 18px 26px 22px; overflow: auto; }
.ls-analysis-head { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
.ls-analysis-eyebrow { font-size: 13px; font-weight: 800; letter-spacing: 0.14em; color: var(--ls-blue); }
.ls-analysis-legend { display: inline-flex; gap: 10px; font-size: 11.5px; margin-left: auto; }
.ls-analysis-body { display: flex; gap: 22px; align-items: flex-start; padding-bottom: 12px; border-bottom: 1px dashed var(--ls-line); }
.ls-analysis-stem { flex: 1 1 auto; min-width: 0; }
.ls-problem-line { font-size: 16px; line-height: 1.85; color: var(--ls-ink); margin-top: 5px; }
.ls-problem-line.is-stem { font-weight: 600; }
.ls-analysis-figs { flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px; max-width: 42%; }
.ls-analysis-fig { max-width: 100%; max-height: 190px; object-fit: contain; background: #fff; border: 1px solid var(--ls-line); border-radius: 10px; padding: 6px; }
.ls-mark-red { color: #b91c1c; background: #fef2f2; border-bottom: 2px solid #dc2626; padding: 0 2px; border-radius: 3px; font-weight: 600; }
.ls-mark-blue { color: #1d4ed8; background: #eff6ff; border-bottom: 2px solid #3b82f6; padding: 0 2px; border-radius: 3px; font-weight: 600; }
.ls-mark-green { color: #047857; background: #ecfdf5; border-bottom: 2px solid #10b981; padding: 0 2px; border-radius: 3px; font-weight: 600; }
.ls-analysis-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-top: 14px; }
.ls-analysis-block { background: #fff; border: 1px solid var(--ls-line); border-radius: 12px; padding: 10px 14px; }
.ls-analysis-block-title { font-size: 12.5px; font-weight: 800; color: var(--ls-blue); border-left: 3px solid var(--ls-blue); padding-left: 8px; margin-bottom: 6px; }
.ls-analysis-block.is-hidden .ls-analysis-block-title { color: #047857; border-color: #10b981; }
.ls-analysis-block.is-find .ls-analysis-block-title { color: #b91c1c; border-color: #dc2626; }
.ls-analysis-block.is-ideas .ls-analysis-block-title { color: #92400e; border-color: #f59e0b; }
.ls-analysis-item { display: flex; gap: 7px; font-size: 13.5px; line-height: 1.65; color: var(--ls-ink); margin-top: 4px; }
.ls-analysis-item-mark { flex: none; color: var(--ls-grey); font-weight: 800; }
.ls-analysis-return, .ls-summary-return { position: sticky; bottom: 0; float: right; margin-top: 12px; box-shadow: 0 6px 18px rgba(29, 78, 216, 0.35); }
.ls-problem-pill { position: absolute; left: 10px; top: 10px; z-index: 6; border: 1px solid var(--ls-line); background: rgba(255, 255, 255, 0.95); border-radius: 999px; padding: 5px 12px; font-size: 12.5px; font-weight: 700; color: var(--ls-ink); cursor: pointer; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); }
.ls-problem-pill:hover { border-color: var(--ls-blue); color: var(--ls-blue); }

/* 总结页:一页 PPT 式(占满舞台),四色块分区(板书规范:红=易错警示,色不过三系),
   条目内【重点词】渲染为该组重点色胶囊 */
.ls-summary-page { position: absolute; inset: 0; z-index: 5; background: var(--ls-paper); padding: 18px 26px 22px; overflow: auto; }
/* 「题目」标签悬在左上,页眉让开它 */
.ls-summary-page .ls-analysis-head, .ls-analysis-page .ls-analysis-head { margin-left: 72px; min-height: 26px; }
.ls-summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 12px; }
.ls-summary-block { --sum-color: var(--ls-blue); --sum-bg: #eff6ff; border: 1.5px solid var(--sum-color); border-left-width: 6px; background: var(--sum-bg); border-radius: 14px; padding: 12px 16px 14px; transition: opacity 0.2s; }
.ls-summary-block.is-keypoints { --sum-color: #dc2626; --sum-bg: #fef2f2; }
.ls-summary-block.is-methods { --sum-color: #d97706; --sum-bg: #fffbeb; }
.ls-summary-block.is-variants { --sum-color: #059669; --sum-bg: #ecfdf5; }
.ls-summary-block-title { display: flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 800; color: var(--sum-color); }
.ls-summary-icon { font-size: 16px; }
.ls-summary-item { display: flex; gap: 8px; margin-top: 9px; font-size: 15px; line-height: 1.7; color: var(--ls-ink); }
.ls-summary-item-mark { flex: none; font-weight: 800; color: var(--sum-color); }
.ls-sum-accent { color: var(--sum-color); background: #fff; border: 1px solid var(--sum-color); border-radius: 6px; padding: 0 5px; margin: 0 1px; font-weight: 800; }

/* 读数面板(模板在 SVG 里画,这里只给字体) */
.ls-readout { font-family: 'SF Mono', Menlo, Consolas, monospace; }

html,body{margin:0;height:100%;background:#eceae4}body{display:grid;place-items:center;padding:12px;box-sizing:border-box}#lecture-app{width:100%;height:100%;max-width:1280px}</style>
</head>
<body>
<div id="lecture-app"></div>
<script>/*
 * LectureScene · 场景运行时基础库(纯浏览器脚本,无依赖)
 * - 时钟/补间(可整体暂停,供播放器「随时暂停」)
 * - SVG 助手、坐标映射
 * - 拖拽手柄与画布内滑杆(学生「玩」的入口)
 * 挂到 window.LectureScene 命名空间,模板与播放器共用。
 */
(function (global) {
  'use strict';
  var LS = (global.LectureScene = global.LectureScene || {});
  var SVG_NS = 'http://www.w3.org/2000/svg';

  // ---------------- 时钟与补间 ----------------
  // 所有动画都走这个时钟;paused 时 now() 不前进,rAF 回调照常但不推进,于是「暂停」对所有动画一致有效。
  var Clock = {
    _paused: false,
    _offset: 0,
    _pausedAt: 0,
    now: function () {
      if (this._paused) return this._pausedAt - this._offset;
      return performance.now() - this._offset;
    },
    pause: function () {
      if (this._paused) return;
      this._pausedAt = performance.now();
      this._paused = true;
    },
    resume: function () {
      if (!this._paused) return;
      this._offset += performance.now() - this._pausedAt;
      this._paused = false;
    },
    isPaused: function () {
      return this._paused;
    }
  };

  var easings = {
    linear: function (t) { return t; },
    easeOut: function (t) { return 1 - Math.pow(1 - t, 3); },
    easeInOut: function (t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  };

  var activeTweens = [];
  var rafId = 0;
  function pump() {
    rafId = 0;
    var t = Clock.now();
    for (var i = activeTweens.length - 1; i >= 0; i--) {
      var tw = activeTweens[i];
      if (tw.cancelled) { activeTweens.splice(i, 1); continue; }
      var p = Math.min(1, Math.max(0, (t - tw.start) / tw.duration));
      tw.onUpdate(tw.ease(p), p);
      if (p >= 1) {
        activeTweens.splice(i, 1);
        tw.resolve();
      }
    }
    if (activeTweens.length) rafId = requestAnimationFrame(pump);
  }
  /** 补间:返回 Promise,带 cancel;duration 0 立即完成 */
  function tween(opts) {
    var duration = Math.max(0, opts.duration || 0);
    var handle = { cancelled: false };
    var p = new Promise(function (resolve) {
      var tw = {
        start: Clock.now(),
        duration: duration || 1,
        ease: easings[opts.easing || 'easeInOut'] || easings.easeInOut,
        onUpdate: opts.onUpdate || function () {},
        resolve: resolve,
        cancelled: false
      };
      handle.cancel = function () { tw.cancelled = true; handle.cancelled = true; resolve(); };
      if (duration === 0) { tw.onUpdate(1, 1); resolve(); return; }
      activeTweens.push(tw);
      if (!rafId) rafId = requestAnimationFrame(pump);
    });
    p.cancel = function () { if (handle.cancel) handle.cancel(); };
    return p;
  }
  /** 受时钟控制的等待(暂停时不计时) */
  function wait(ms) {
    return tween({ duration: ms, onUpdate: function () {} });
  }
  function cancelAllTweens() {
    activeTweens.forEach(function (tw) { tw.cancelled = true; tw.resolve(); });
    activeTweens.length = 0;
  }

  // ---------------- SVG 助手 ----------------
  function el(name, attrs, parent) {
    var node = document.createElementNS(SVG_NS, name);
    if (attrs) for (var k in attrs) if (attrs[k] != null) node.setAttribute(k, String(attrs[k]));
    if (parent) parent.appendChild(node);
    return node;
  }
  function attr(node, attrs) {
    for (var k in attrs) if (attrs[k] != null) node.setAttribute(k, String(attrs[k]));
    return node;
  }
  function text(parent, x, y, str, attrs) {
    var t = el('text', Object.assign({ x: x, y: y }, attrs || {}), parent);
    t.textContent = str;
    return t;
  }
  function fmt(v, digits) {
    var d = digits == null ? 2 : digits;
    var s = Number(v).toFixed(d);
    if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    if (s === '-0') s = '0';
    return s;
  }
  var clamp = function (v, lo, hi) { return Math.min(hi, Math.max(lo, v)); };
  function snap(v, step) {
    if (!step) return v;
    return Math.round(v / step) * step;
  }

  // ---------------- 坐标映射(数学场景) ----------------
  /** 数学坐标 ↔ 像素;view = {xMin,xMax,yMin,yMax}, box = {x,y,w,h} */
  function Mapper(view, box) {
    this.view = view; this.box = box;
  }
  Mapper.prototype.px = function (x) { return this.box.x + ((x - this.view.xMin) / (this.view.xMax - this.view.xMin)) * this.box.w; };
  Mapper.prototype.py = function (y) { return this.box.y + this.box.h - ((y - this.view.yMin) / (this.view.yMax - this.view.yMin)) * this.box.h; };
  Mapper.prototype.mx = function (px) { return this.view.xMin + ((px - this.box.x) / this.box.w) * (this.view.xMax - this.view.xMin); };
  Mapper.prototype.my = function (py) { return this.view.yMin + ((this.box.y + this.box.h - py) / this.box.h) * (this.view.yMax - this.view.yMin); };

  /** 画网格 + 坐标轴 + 刻度(返回 <g>) */
  function drawAxes(parent, mapper, opts) {
    opts = opts || {};
    var g = el('g', { class: 'ls-axes' }, parent);
    var v = mapper.view;
    var grid = el('g', { stroke: opts.gridColor || '#E5E7EB', 'stroke-width': 1 }, g);
    for (var x = Math.ceil(v.xMin); x <= v.xMax; x++) el('line', { x1: mapper.px(x), y1: mapper.py(v.yMin), x2: mapper.px(x), y2: mapper.py(v.yMax) }, grid);
    for (var y = Math.ceil(v.yMin); y <= v.yMax; y++) el('line', { x1: mapper.px(v.xMin), y1: mapper.py(y), x2: mapper.px(v.xMax), y2: mapper.py(y) }, grid);
    var axes = el('g', { stroke: opts.axisColor || '#1F2328', 'stroke-width': 1.6 }, g);
    var y0 = clamp(0, v.yMin, v.yMax), x0 = clamp(0, v.xMin, v.xMax);
    el('line', { x1: mapper.px(v.xMin), y1: mapper.py(y0), x2: mapper.px(v.xMax), y2: mapper.py(y0) }, axes);
    el('line', { x1: mapper.px(x0), y1: mapper.py(v.yMin), x2: mapper.px(x0), y2: mapper.py(v.yMax) }, axes);
    // 箭头
    el('path', { d: 'M' + (mapper.px(v.xMax)) + ' ' + mapper.py(y0) + ' l-10 -5 v10 z', fill: opts.axisColor || '#1F2328', stroke: 'none' }, axes);
    el('path', { d: 'M' + mapper.px(x0) + ' ' + mapper.py(v.yMax) + ' l-5 10 h10 z', fill: opts.axisColor || '#1F2328', stroke: 'none' }, axes);
    var labels = el('g', { fill: '#6B7280', 'font-size': 12, 'font-family': 'system-ui, sans-serif' }, g);
    for (var xi = Math.ceil(v.xMin); xi <= v.xMax; xi++) if (xi !== 0 && xi < v.xMax) text(labels, mapper.px(xi), mapper.py(y0) + 16, String(xi), { 'text-anchor': 'middle' });
    for (var yi = Math.ceil(v.yMin); yi <= v.yMax; yi++) if (yi !== 0 && yi < v.yMax) text(labels, mapper.px(x0) - 8, mapper.py(yi) + 4, String(yi), { 'text-anchor': 'end' });
    text(labels, mapper.px(x0) - 8, mapper.py(y0) + 16, 'O', { 'text-anchor': 'end' });
    text(labels, mapper.px(v.xMax) - 4, mapper.py(y0) - 8, 'x', { 'text-anchor': 'end', 'font-style': 'italic', fill: '#1F2328' });
    text(labels, mapper.px(x0) + 8, mapper.py(v.yMax) + 12, 'y', { 'font-style': 'italic', fill: '#1F2328' });
    return g;
  }

  /** 函数图象路径:采样 fn 于 [xMin, xMax],progress∈[0,1] 控制画出比例(从左往右) */
  function functionPath(mapper, fn, progress, samples) {
    var v = mapper.view, n = samples || 160;
    var upto = Math.max(1, Math.round(n * (progress == null ? 1 : progress)));
    var d = '';
    for (var i = 0; i <= upto; i++) {
      var x = v.xMin + ((v.xMax - v.xMin) * i) / n;
      var y = fn(x);
      if (!isFinite(y)) continue;
      // 裁剪到视窗上下 2 格,避免超长路径
      var yc = clamp(y, v.yMin - 2, v.yMax + 2);
      d += (d ? ' L' : 'M') + mapper.px(x).toFixed(1) + ' ' + mapper.py(yc).toFixed(1);
    }
    return d;
  }

  /**
   * 在视窗内给函数图象挑一个放手柄的横坐标:优先 prefer,若该处 y 出界则在可见区间里找离 prefer 最近的点。
   * 手柄跑到画布外会被页头/字幕条盖住,拖不到(2026-09-03 无头测试发现)。
   */
  function pickVisibleX(mapper, fn, prefer) {
    var v = mapper.view, margin = 0.4;
    var inside = function (x) { var y = fn(x); return isFinite(y) && y > v.yMin + margin && y < v.yMax - margin; };
    if (prefer > v.xMin + margin && prefer < v.xMax - margin && inside(prefer)) return prefer;
    var best = null, bestD = Infinity;
    for (var i = 0; i <= 120; i++) {
      var x = v.xMin + margin + ((v.xMax - v.xMin - 2 * margin) * i) / 120;
      if (!inside(x)) continue;
      var d = Math.abs(x - prefer);
      if (d < bestD) { bestD = d; best = x; }
    }
    return best == null ? clamp(prefer, v.xMin + margin, v.xMax - margin) : best;
  }

  // ---------------- 拖拽 ----------------
  /**
   * 让 node 可拖:onDrag(dx, dy, ev, start) 以像素增量回调;返回销毁函数。
   * 用 pointer 事件,兼容鼠标/触屏;拖动时给 node 加 .ls-dragging。
   */
  function draggable(node, handlers) {
    var start = null;
    function down(ev) {
      if (node.getAttribute('data-locked') === '1') return;
      ev.preventDefault();
      node.setPointerCapture && node.setPointerCapture(ev.pointerId);
      start = { x: ev.clientX, y: ev.clientY };
      node.classList.add('ls-dragging');
      handlers.onStart && handlers.onStart(ev);
    }
    function move(ev) {
      if (!start) return;
      handlers.onDrag(ev.clientX - start.x, ev.clientY - start.y, ev, start);
    }
    function up(ev) {
      if (!start) return;
      start = null;
      node.classList.remove('ls-dragging');
      handlers.onEnd && handlers.onEnd(ev);
    }
    node.addEventListener('pointerdown', down);
    node.addEventListener('pointermove', move);
    node.addEventListener('pointerup', up);
    node.addEventListener('pointercancel', up);

  };
  Player.prototype._renderDots = function () {
    var self = this;
    this.dots.innerHTML = '';
    this.script.steps.forEach(function (st, i) {

  Player.prototype._updateDots = function () {
    var self = this;

      d.classList.toggle('is-current', i === self.stepIndex && !terminal && self.state !== 'idle');

    });

    this.stepLabel.textContent =
      this.state === 'idle' ? '审题 · 已知 · 求什么 · 思路'

      : this.state === 'explore' ? '动手环节 · 拖一拖,验证刚才的结论'
      : st ? '第 ' + (this.stepIndex + 1) + ' / ' + this.script.steps.length + ' 步 · ' + (st.title || '') : '';
  };
  Player.prototype._setSubtitle = function (text, progress) {

  };
  Player.prototype._setHint = function (text, tone) {

  };
  Player.prototype._updateControls = function () {

    this.btnPrev.disabled = i <= 0 || s === 'idle';
    this.btnReplay.disabled = i < 0 || s === 'idle' || s === 'summary';

    this.btnPlay.textContent =
      s === 'idle' ? '▶ 开始讲解'
      : s === 'playing' || s === 'summary' ? '⏸ 暂停'
      : s === 'paused' ? '▶ 继续播放'
      : s === 'waiting' ? '▶ 继续'

      s === 'summary' ? '进入动手环节 →'

  Player.prototype._setState = function (s) {

  };
  Player.prototype._hasTakeaways = function () {
    var t = this.script.takeaways || {};
    return Boolean((t.knowledge && t.knowledge.length) || (t.keyPoints && t.keyPoints.length) || (t.methods && t.methods.length) || (t.variants && t.variants.length));
  };

  // ---------------- 审题页 ----------------
  /** 题干高亮:按 analysis.marks(三色笔法)把命中的词包成着色片段 */
  Player.prototype._highlightInto = function (parent, text) {
    var marks = (this.script.analysis && this.script.analysis.marks) || [];
    var valid = marks.filter(function (m) { return m && m.text && ['red', 'blue', 'green'].indexOf(m.color) >= 0; });
    var rest = text;
    while (rest.length) {
      var best = null;
      for (var i = 0; i < valid.length; i++) {
        var idx = rest.indexOf(valid[i].text);
        if (idx < 0) continue;
        if (!best || idx < best.idx || (idx === best.idx && valid[i].text.length > best.m.text.length)) best = { idx: idx, m: valid[i] };
      }
      if (!best) { parent.appendChild(document.createTextNode(rest)); break; }
      if (best.idx > 0) parent.appendChild(document.createTextNode(rest.slice(0, best.idx)));
      h('span', 'ls-mark-' + best.m.color, parent, best.m.text);
      rest = rest.slice(best.idx + best.m.text.length);
    }
  };
  /** 构建审题页;review=讲解中回看(带「返回讲解」按钮) */
  Player.prototype._buildAnalysisPage = function (review) {
    var self = this;
    var page = this.analysisPage;
    page.innerHTML = '';
    var head = h('div', 'ls-analysis-head', page);
    h('span', 'ls-analysis-eyebrow', head, '审题');
    var legend = h('span', 'ls-analysis-legend', head);
    h('span', 'ls-mark-red', legend, '限制条件');
    h('span', 'ls-mark-blue', legend, '数据');
    h('span', 'ls-mark-green', legend, '隐含线索');
    var body = h('div', 'ls-analysis-body', page);
    var stem = h('div', 'ls-analysis-stem', body);
    var text = this.script.problem || this.script.title || '';
    // 分行:(1)(2) 处断行;①② 只在句末标点后断(句中引用「① 的条件下」不切)
    var parts = text
      .split(/(?=\(\d\))/)
      .reduce(function (acc, seg) { return acc.concat(seg.split(/(?<=[。;;!?])\s*(?=[①②③④⑤])/)); }, [])
      .map(function (s) { return s.trim(); })
      .filter(Boolean);
    (parts.length ? parts : [text]).forEach(function (line, i) {
      var div = h('div', 'ls-problem-line' + (i === 0 ? ' is-stem' : ''), stem);
      self._highlightInto(div, line);
    });
    var images = this.script.problemImages || [];
    if (images.length) {
      var figs = h('div', 'ls-analysis-figs', body);
      images.forEach(function (src) {
        var img = document.createElement('img');
        img.className = 'ls-analysis-fig';
        img.src = src;
        figs.appendChild(img);
      });
    }
    var a = this.script.analysis || {};
    var blocks = [
      { title: '已知', items: a.given || [], cls: 'given' },
      { title: '隐含条件', items: a.hidden || [], cls: 'hidden' },
      { title: '求什么', items: a.find || [], cls: 'find' },
      { title: '思路切入', items: a.ideas || [], cls: 'ideas' }
    ].filter(function (b) { return b.items.length; });
    if (blocks.length) {
      var grid = h('div', 'ls-analysis-grid', page);
      blocks.forEach(function (b) {
        var box = h('div', 'ls-analysis-block is-' + b.cls, grid);
        h('div', 'ls-analysis-block-title', box, b.title);
        b.items.forEach(function (item) {
          var li = h('div', 'ls-analysis-item', box);
          h('span', 'ls-analysis-item-mark', li, '·');
          h('span', null, li, item);
        });
      });
    }
    if (review) {
      var back = h('button', 'ls-btn ls-btn-primary ls-analysis-return', page, '▶ 返回讲解');
      back.type = 'button';
      back.addEventListener('click', function () { self._closeAnalysisReview(); });
    }
  };
  Player.prototype._showAnalysisPage = function (review) {
    this._buildAnalysisPage(review);
    this.analysisPage.style.display = 'block';
  };
  /** 讲解中点「题目」标签:自动暂停 + 整页审题页;「返回讲解」恢复 */
  Player.prototype._onPillClick = function () {
    if (this.analysisPage.style.display !== 'none') { this._closeAnalysisReview(); return; }
    this._reviewResume = false;
    if (this.state === 'playing' || this.state === 'summary') {
      this.pause();
      this._reviewResume = true;
    }
    this._showAnalysisPage(true);
  };
  Player.prototype._closeAnalysisReview = function () {
    this.analysisPage.style.display = 'none';
    if (this._reviewResume && this.state === 'paused') this.resume();
    this._reviewResume = false;
  };
  Player.prototype._showPill = function () {
    if (this.script.problem) this.problemPill.style.display = '';
  };

  // ---------------- 参数 ----------------
  /** 第 i 步的标准参数 = 剧本 params 叠加该步 params;i < 0 时为纯标准参数(动手环节用) */
  Player.prototype._canonicalParams = function (i) {
    var base = Object.assign({}, this.tpl.defaults(), this.script.params || {});
    var st = i >= 0 ? this.script.steps[i] : null;
    if (st && st.params) Object.assign(base, st.params);
    return base;
  };

  /** 动手环节配置:explore 字段缺省时,由各步 unlock 并集兜底;并集为空 → 开放全部 */
  Player.prototype._exploreConfig = function () {
    var ex = this.script.explore || {};
    var unlock = Array.isArray(ex.unlock) ? ex.unlock.slice() : [];
    if (!unlock.length) {
      var union = [];
      this.script.steps.forEach(function (st) {
        (st.unlock || []).forEach(function (u) { if (union.indexOf(u) < 0) union.push(u); });
      });
      unlock = union;
    }
    if (!unlock.length) unlock = Object.keys(this.tpl.params || {});
    return {
      unlock: unlock,
      tasks: Array.isArray(ex.tasks) ? ex.tasks.filter(Boolean) : [],
      hint: ex.hint || '到你动手了:拖动画面上亮起的手柄,验证刚才讲的结论。'
    };
  };

  // ---------------- 控制 ----------------
  Player.prototype._onAction = function (action) {
    switch (action) {
      case 'play':
        if (this.state === 'idle') return this.goto(0);
        if (this.state === 'playing' || this.state === 'summary') return this.pause();
        if (this.state === 'paused') return this.resume();
        if (this.state === 'waiting') return this._advance();
        if (this.state === 'explore') return this.goto(0);
        break;
      case 'replay': return this.goto(this.stepIndex);
      case 'next':
        if (this.state === 'summary') { this._abortCurrent(); this._enterExplore(); return; }
        if (this.state === 'playing' || this.state === 'paused' || this.state === 'waiting') return this._advance();
        break;
      case 'prev': return this.goto(Math.max(0, this.stepIndex - 1));
      case 'takeaways':
        if (this.state === 'explore') this._toggleTakeawaysCard();
        break;
      case 'tts':
        this.tts.stop();
        this.tts = LS.tts.create(this.tts instanceof LS.tts.SilentProvider ? 'browser' : 'silent');
        this.tts.rate = this.script.ttsRate || 1;
        this.btnTts.textContent = this.tts.available ? '🔊 语音开' : '🔇 仅字幕';
        break;
      case 'reset':
        this.scene.setParams(this._canonicalParams(-1));
        break;
    }
  };

  /** 进下一步;已是最后一步则进总结 */
  Player.prototype._advance = function () {
    if (this.stepIndex >= this.script.steps.length - 1) return this._startSummary();
    return this.goto(this.stepIndex + 1);
  };

  Player.prototype.pause = function () {
    if (this.state !== 'playing' && this.state !== 'summary') return;
    this._pausedFrom = this.state;
    Clock.pause();
    this.tts.pause();
    this._setState('paused');
  };
  Player.prototype.resume = function () {
    if (this.state !== 'paused') return;
    Clock.resume();
    this.tts.resume();
    this._setState(this._pausedFrom || 'playing');
  };

  Player.prototype._abortCurrent = function () {
    this._stepToken++;
    if (this._speech) { this._speech.cancel(); this._speech = null; }
    LS.cancelAllTweens();
    if (Clock.isPaused()) Clock.resume();
    this._reviewResume = false;
    this.tasksBox.style.display = 'none';
    this.analysisPage.style.display = 'none';
    this.summaryPage.style.display = 'none';
    if (LS.effects && this.scene) LS.effects.clear(this.scene); // 残留的 focus/label 效果一并清场
  };

  /** 跳到第 i 步并播放(点编号/上一步/重听都走这里) */
  Player.prototype.goto = function (i) {
    var st = this.script.steps[i];
    if (!st) return;
    this._playStep(i);
  };

  Player.prototype._playStep = function (i) {
    var self = this;
    var st = this.script.steps[i];
    if (!st) return;
    this._abortCurrent();
    this._showPill();
    var token = this._stepToken;
    this.stepIndex = i;
    this._updateDots();
    this._setHint('');
    this.scene.setUnlocked([]);
    this.scene.setParams(this._canonicalParams(i));
    this._fastForward(i);
    if (typeof this.scene.beginStep === 'function') this.scene.beginStep(st, i);
    this._setState('playing');
    this._emit('step', { index: i, step: st });
    this._setSubtitle('', 0);

    var run = (st.flow && st.flow.length)
      ? this._runFlow(st, token)
      : this._runLegacy(st, token);

    run.then(function () {
      if (token !== self._stepToken) return;
      self._speech = null;
      self.progressFill.style.width = '100%';
      return LS.wait(st.dwellMs == null ? 1200 : st.dwellMs);
    }).then(function () {
      if (token !== self._stepToken) return;
      if (i >= self.script.steps.length - 1) return self._startSummary();
      if (self.script.advance === 'manual') {
        self._setHint('这一步讲完了,点「继续」进入下一步。', 'info');
        self._setState('waiting');
        return;
      }
      self._advance();
    });
  };

  /** 执行一个动作:模板声明支持的交给模板,通用效果(label/focus/pulse)走运行时 */
  Player.prototype._runAction = function (act, st) {
    var supported = (this.tpl.actions || []).indexOf(act.type) >= 0;
    if (!supported && LS.effects && LS.effects.types.indexOf(act.type) >= 0) {
      return LS.effects.apply(this.scene, act);
    }
    return this.scene.applyAction(act, { player: this, step: st });
  };

  /** 新形态:flow 交错。say 定界;do 挡进度;fx 不挡(与后续 say 并行) */
  Player.prototype._runFlow = function (st, token) {
    var self = this;
    var items = st.flow.slice();
    var fullText = items.map(function (it) { return it.say || ''; }).filter(Boolean).join('');
    var spoken = 0;
    return items.reduce(function (p, it) {
      return p.then(function () {
        if (token !== self._stepToken) return;
        if (it.say) {
          var text = String(it.say);
          self._setSubtitle(text, fullText ? spoken / fullText.length : 0);
          var speech = self.tts.speak(text, {
            onBoundary: function (idx) {
              if (token !== self._stepToken) return;
              var done = spoken + Math.min(idx, text.length);
              self.progressFill.style.width = Math.round((done / Math.max(1, fullText.length)) * 100) + '%';
            }
          });
          self._speech = speech;
          return speech.done.then(function () { spoken += text.length; });
        }
        if (it.do) return self._runAction(it.do, st);
        if (it.fx) {
          var fx = self._runAction(it.fx, st);
          if (fx && fx.catch) fx.catch(function () {});
          return; // 不等
        }
      });
    }, Promise.resolve());
  };

  /** 旧形态:整段讲解词 ∥ 动作链(兼容存量剧本) */
  Player.prototype._runLegacy = function (st, token) {
    var self = this;
    var narration = st.narration || '';
    this._setSubtitle(narration, 0);
    var speech = this.tts.speak(narration, {
      onBoundary: function (idx) {
        if (token !== self._stepToken) return;
        self.progressFill.style.width = Math.round((idx / Math.max(1, narration.length)) * 100) + '%';
      }
    });
    this._speech = speech;
    var actions = (st.actions || []).slice();
    var runActions = actions.reduce(function (p, act) {
      return p.then(function () {
        if (token !== self._stepToken) return;
        return self._runAction(act, st);
      });
    }, Promise.resolve());
    return Promise.all([speech.done, runActions]);
  };

  Player.prototype._fastForward = function (upto) {
    var self = this;
    var SKIP = { run: 1, highlight: 1, reset: 1, label: 1, focus: 1, pulse: 1 };
    for (var k = 0; k < upto; k++) {
      var prev = this.script.steps[k];
      var acts = (prev.actions || []).slice();
      (prev.flow || []).forEach(function (it) { if (it.do) acts.push(it.do); });
      acts.forEach(function (act) {
        if (SKIP[act.type]) return;
        var instant = Object.assign({}, act, { durationMs: 0 });
        if (act.type === 'move') { instant.from = act.to; }
        try { self._runAction(instant, prev); } catch (e) {}
      });
    }
    this.scene.setParams(this._canonicalParams(upto));
  };

  // ---------------- 总结 ----------------
  /** 条目文本里的【重点词】渲染为该组重点色;返回念的纯文本 */
  function fillAccented(parent, text) {
    var rest = String(text);
    for (;;) {
      var a = rest.indexOf('【');
      var b = a >= 0 ? rest.indexOf('】', a + 1) : -1;
      if (a < 0 || b < 0) { if (rest) parent.appendChild(document.createTextNode(rest)); break; }
      if (a > 0) parent.appendChild(document.createTextNode(rest.slice(0, a)));
      h('span', 'ls-sum-accent', parent, rest.slice(a + 1, b));
      rest = rest.slice(b + 1);
    }
    return String(text).replace(/[【】]/g, '');
  }

  /**
   * 构建全页总结页(板书规范:四色块分区、红色专用于易错警示、条目内重点词标色)。
   * review=动手环节回看(全部显示 + 「返回」按钮);否则条目初始隐藏,逐条念+浮现。
   */
  Player.prototype._buildSummaryPage = function (review) {
    var self = this;
    var page = this.summaryPage;
    page.innerHTML = '';
    var head = h('div', 'ls-analysis-head', page);
    h('span', 'ls-analysis-eyebrow', head, '总结 · 这道题带走什么');
    var t = this.script.takeaways || {};
    var groups = [
      { key: 'knowledge', icon: '📘', title: '核心知识点', items: t.knowledge || [], cls: 'knowledge' },
      { key: 'keyPoints', icon: '⚠️', title: '考点与易错', items: t.keyPoints || [], cls: 'keypoints' },
      { key: 'methods', icon: '💡', title: '方法与技巧', items: t.methods || [], cls: 'methods' },
      { key: 'variants', icon: '🔁', title: '举一反三', items: t.variants || [], cls: 'variants' }
    ].filter(function (gr) { return gr.items.length; });
    var grid = h('div', 'ls-summary-grid', page);
    var units = [];
    groups.forEach(function (gr) {
      var box = h('div', 'ls-summary-block is-' + gr.cls, grid);
      var title = h('div', 'ls-summary-block-title', box);
      h('span', 'ls-summary-icon', title, gr.icon);
      h('span', null, title, gr.title);
      if (!review) { title.style.opacity = '0'; box.style.opacity = '0'; } // 整块随本组第一条浮现,不留空框
      gr.items.forEach(function (item, idx) {
        var li = h('div', 'ls-summary-item', box);
        h('span', 'ls-summary-item-mark', li, idx + 1 + '.');
        var span = h('span', 'ls-summary-item-text', li);
        var speakText = fillAccented(span, item);
        if (!review) li.style.opacity = '0';
        units.push({ el: li, boxEl: box, text: speakText, group: gr.title, titleEl: idx === 0 ? title : null });
      });
    });
    if (review) {
      var back = h('button', 'ls-btn ls-btn-primary ls-summary-return', page, '返回');
      back.type = 'button';
      back.addEventListener('click', function () { self.summaryPage.style.display = 'none'; });
    }
    return units;
  };
  Player.prototype._startSummary = function () {
    var self = this;
    if (!this._hasTakeaways()) return this._enterExplore();
    this._abortCurrent();
    var token = this._stepToken;
    this.stepIndex = this.script.steps.length - 1;
    // 场景推到讲完的样子(总结页收起后就是动手环节)
    this._fastForward(this.script.steps.length);
    this.scene.setParams(this._canonicalParams(-1));
    this._showPill();
    var units = this._buildSummaryPage(false);
    this.summaryPage.style.display = 'block';
    this._setState('summary');
    var lastGroup = null;
    var chain = units.reduce(function (p, u) {
      return p.then(function () {
        if (token !== self._stepToken) return;
        var text = (u.group !== lastGroup ? u.group + ':' : '') + u.text;
        lastGroup = u.group;
        self._setSubtitle(text, 0);
        var reveal = LS.tween({ duration: 320, onUpdate: function (t2) {
          u.el.style.opacity = String(t2);
          if (u.titleEl) { u.titleEl.style.opacity = String(t2); u.boxEl.style.opacity = String(t2); }
        } });
        var speech = self.tts.speak(text, {
          onBoundary: function (idx) {
            if (token !== self._stepToken) return;
            self.progressFill.style.width = Math.round((idx / Math.max(1, text.length)) * 100) + '%';
          }
        });
        self._speech = speech;
        return Promise.all([speech.done, reveal]);
      });
    }, Promise.resolve());
    chain.then(function () {
      if (token !== self._stepToken) return;
      self._speech = null;
      return LS.wait(1000);
    }).then(function () {
      if (token !== self._stepToken) return;
      self._enterExplore();
    });
  };
  /** 动手环节「📋 总结」:整页回看(全部显示,无语音) */
  Player.prototype._toggleTakeawaysCard = function () {
    if (this.summaryPage.style.display === 'none') {
      this._buildSummaryPage(true);
      this.summaryPage.style.display = 'block';
    } else {
      this.summaryPage.style.display = 'none';
    }
  };

  // ---------------- 动手环节 ----------------
  Player.prototype._enterExplore = function () {
    var self = this;
    this._abortCurrent();
    this.stepIndex = this.script.steps.length - 1;
    this._fastForward(this.script.steps.length);
    this.scene.setParams(this._canonicalParams(-1));
    this._showPill();
    var cfg = this._exploreConfig();
    this.scene.setUnlocked(cfg.unlock);
    this._setHint(cfg.hint, 'play');
    this._setSubtitle(this.script.summary || '讲解结束,现在自己动手试一试。', 1);
    this._renderTasks(cfg.tasks);
    this._setState('explore');
    this._emit('explore', { unlock: cfg.unlock, tasks: cfg.tasks });
  };

  Player.prototype._renderTasks = function (tasks) {
    var box = this.tasksBox;
    box.innerHTML = '';
    if (!tasks.length) { box.style.display = 'none'; return; }
    h('span', 'ls-tasks-title', box, '动手试试');
    tasks.forEach(function (t) {
      var item = h('button', 'ls-task', box);
      item.type = 'button';
      h('span', 'ls-task-mark', item, '○');
      h('span', 'ls-task-text', item, t);
      item.addEventListener('click', function () {
        var done = item.classList.toggle('is-done');
        item.querySelector('.ls-task-mark').textContent = done ? '✓' : '○';
      });
    });
    box.style.display = 'flex';
  };

  Player.prototype.destroy = function () {

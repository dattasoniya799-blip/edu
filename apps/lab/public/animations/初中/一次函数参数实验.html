<!DOCTYPE html>
<!--
════════════════ PRD · 一次函数参数实验 ════════════════
EVAL:动态收益 4(k、b 各管一种性质,静态要画一族直线才说得清)
      交互必要性 5(「k 变陡但过 y 轴那点不动」必须自己拖才有体感)
      合计 9 → 通过

一句话定位:
  k 决定直线倾斜的方向和陡缓,b 决定直线穿过 y 轴的位置,改一个不影响另一个。

核心误区:
  学生常把 b 当成「直线与 x 轴的交点」,或者以为 k 一变、直线和 y 轴的交点也跟着跑。

单一认知动作:
  变换 —— 参数连续改变,直线连续变形。本页不讲解方程、不讲不等式、不讲待定系数法。

交互流程:
  1) 向右拖 k 滑杆 → 直线绕 (0,b) 逆时针抬起、变陡 → 同一段水平位移换来更大的上升;
     向左拖过 0 → 直线翻向右下 → 上升变成下降。
  2) 向右拖 b 滑杆 → 整条直线平行上移 → 倾斜程度一点没变。
  3) 每次拖动,反馈区立刻写出当前数值说明的规律。

分步揭示设计:
  阶段 1:只有坐标系 + 一条可调直线 + 两根滑杆。没有标注、没有公式。
  阶段 2:加 (0,b) 截距点 与 Δx=1 / Δy=k 的台阶标注(把 k 读成「右 1 格抬几格」)。
  阶段 3:出解析式与增减性结论。

概念反馈文案:
  - 「k = 1.8 是正数,x 每往右 1 格,y 就抬 1.8 格 —— 这就是 k 为正时 y 随 x 增大而增大。」
  - 「k 从头到尾在变,直线却一直穿过 (0, 2.0) 这一个点:b 没动,交点就不会动。」
  - 「b = -1.5,直线与 y 轴交在 (0, -1.5)。它是纵轴上的交点,不是与 x 轴的交点。」

运动设计(引擎 v2):
  常驻 rAF 主循环;k / b / 阶段透明度全部 target-current 双轨缓动,事件只改 target。
  巡航脚本:k 1→2→-2 扫过 0(只动 k,截距点定住)→ 回正并出台阶 → 只动 b 上下平移
  → 出解析式 → 两参数同动 → 无缝回到起点。台阶上有一个「右 1 格」的持续行走标记,
  反复把 k 读成一个可数的抬升动作。
════════════════════════════════════════════════════
-->
<html lang="zh-CN">
<head>

<style>
:root{
  --paper:#fdf8f0; --sheet:#ffffff; --sheet-sub:#f5eee3; --rule:#e8dcc9;
  --ink-1:#2a2118; --ink-2:#6b5d4c; --ink-3:#a49684;
  --hi-a:#b3541e; --hi-a-soft:#fbe6d3;
  --hi-b:#256b60; --hi-b-soft:#d9ece6;
  --hi-c:#6d4b9c; --hi-c-soft:#e9e0f5;
  --grid:#efe5d5; --axis:#8c7f6e;
  --tap:44px; --r-lg:12px; --r-sm:7px;
  --shade:0 1px 6px rgba(60,40,20,.09);

}

body{margin:0;background:var(--paper);color:var(--ink-1);font-family:var(--font);
     font-size:14px;line-height:1.6;overflow-x:hidden;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:14px 12px 26px}
h1{font-size:17px;margin:0 0 3px}

.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}

     color:var(--ink-2);border:1px solid var(--rule)}

      box-shadow:var(--shade);padding:11px;margin:0 0 11px}
canvas{display:block;width:100%;height:auto;touch-action:none;border-radius:var(--r-sm)}

.row.pk .name,.row.pk .val{color:var(--hi-a)}
.row.pb .name,.row.pb .val{color:var(--hi-b)}
input[type=range]{flex:1;min-width:0;height:var(--tap);background:transparent}
.row.pk input[type=range]{accent-color:var(--hi-a)}
.row.pb input[type=range]{accent-color:var(--hi-b)}

.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
button{font-family:var(--font);font-size:13.5px;min-height:var(--tap);padding:0 15px;
       border-radius:var(--r-sm);border:1px solid var(--rule);background:var(--sheet-sub);
       color:var(--ink-1);cursor:pointer;transition:background-color .2s ease,color .2s ease}
button.play{background:var(--hi-c-soft);border-color:var(--hi-c);color:var(--hi-c);font-weight:600;
            min-width:106px}

button:disabled{opacity:.45;cursor:default}

    padding:9px 11px;font-size:13px;color:var(--ink-1)}
.fb b{color:var(--hi-b)}

    background:var(--hi-c-soft);border-radius:var(--r-sm);padding:8px 11px}

          color:var(--ink-2);margin-top:3px}

/* 分步揭示也不许闪现:用 max-height + opacity 缓出,和画布里的 alpha 双轨同一个手感。 */

      transition:max-height .42s ease,opacity .32s ease,margin-top .42s ease}

/* 宽屏两栏(平板横屏单屏收纳):画布卡锁左、反馈卡在右,整页 100dvh 不滚动;
   ≤900px 维持原单列(375px 校验行为不变)。 */
@media (min-width: 900px){
  .wrap{
    max-width:none;height:100dvh;box-sizing:border-box;overflow:hidden;
    display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.85fr);
    grid-template-rows:auto auto auto minmax(0,1fr);
    column-gap:16px;align-content:start;padding:12px 18px;
  }
  .wrap > h1{grid-column:1/-1;margin:0 0 2px}
  .wrap > .lead{grid-column:1/-1;margin:0 0 6px}
  .wrap > .tags{grid-column:1/-1;margin:0 0 8px}
  body{overflow:hidden}
  .wrap > .card{grid-row:4;margin:0;min-height:0;overflow:hidden}
  .wrap > .card:nth-of-type(1){grid-column:1}
  .wrap > .card:nth-of-type(2){grid-column:2}
}

</head>
<body>
<main class="wrap">
  <h1>一次函数参数实验</h1>
  <p class="lead">按「播放演示」看一遍,或者自己拖两根滑杆:<span class="mono">y = kx + b</span> 里的 k 和 b 各自管着直线的什么。</p>
  <div class="tags">
    <span class="tag">初中 · 一次函数</span>
    <span class="tag">认知动作:变换</span>
    <span class="tag">难度:中</span>
  </div>

  <section class="card">
    <canvas id="cv" width="360" height="290" aria-label="一次函数图象"></canvas>
    <div class="ctl">
      <div class="row pk">
        <span class="name">k</span>
        <input id="sk" type="range" min="-3" max="3" step="0.01" value="1" aria-label="斜率 k">
        <span class="val" id="vk">1.0</span>
      </div>
      <div class="row pb">
        <span class="name">b</span>
        <input id="sb" type="range" min="-4" max="4" step="0.05" value="0" aria-label="截距 b">
        <span class="val" id="vb">0.0</span>
      </div>
      <p class="hint" id="hint">先只管 k:向右拖,看直线怎么动。</p>
      <div class="bar">
        <button id="play" class="play" type="button">播放演示</button>
        <button id="next" class="go" type="button">下一步</button>
        <button id="reset" type="button">重置</button>
        <span class="step" id="stage">阶段 1 / 3</span>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="fb" id="fb">向右拖 k 滑杆试试,或者按播放让它自己走。</div>
    <div class="slot" id="eqSlot"><div class="eq" id="eq"></div></div>
  </section>
</main>

<script>
(function(){
  'use strict';
  var CS = getComputedStyle(document.documentElement);
  function c(n){ return CS.getPropertyValue(n).trim(); }
  var COL = {
    grid:c('--grid'), axis:c('--axis'), sheet:c('--sheet'),
    ink1:c('--ink-1'), ink2:c('--ink-2'), ink3:c('--ink-3'),
    a:c('--hi-a'), aSoft:c('--hi-a-soft'),
    b:c('--hi-b'), bSoft:c('--hi-b-soft'),
    cc:c('--hi-c'), ccSoft:c('--hi-c-soft')
  };
  var MONO = c('--mono');

  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var sk = document.getElementById('sk'), sb = document.getElementById('sb');
  var vk = document.getElementById('vk'), vb = document.getElementById('vb');
  var fb = document.getElementById('fb'), eq = document.getElementById('eq');
  var eqSlot = document.getElementById('eqSlot');
  var hint = document.getElementById('hint'), stageEl = document.getElementById('stage');
  var btnPlay = document.getElementById('play');
  var btnNext = document.getElementById('next'), btnReset = document.getElementById('reset');

  /* ══════════ 运动引擎:双轨状态 + 常驻主循环 ══════════ */
  // k 是「每 1/60 秒还剩多少差距」:越小越快。SMOOTH 常规,GRAB 拖拽跟手,SNAP 重置回摆。
  var K_SMOOTH = 0.90, K_GRAB = 0.55, K_SNAP = 0.78;
  function approach(now, want, dt, kk){
    return now + (want - now) * (1 - Math.pow(kk, dt * 60));
  }
  function clamp(v, lo, hi){ return v < lo ? lo : (v > hi ? hi : v); }
  function smoothstep(u){ u = clamp(u, 0, 1); return u * u * (3 - 2 * u); }

  var K0 = 1, B0 = 0;
  // target = 交互与巡航写入的目标;current = 画面上真正在用的值,每帧向 target 缓动。
  var tgt = { k:K0, b:B0, stage:1 };
  var cur = { k:K0, b:B0, a2:0, a3:0, walk:0 };
  var play = { on:false, t:0 };
  var drag = { key:null };
  var focus = 'k', boost = 0;

  var W = 360, H = 290, unit = 30, ox = 180, oy = 145;

  // 世界坐标固定 x∈[-6,6];y 半幅由画布高度决定,保证横纵同比例(不歪曲斜率)。
  // 宽屏两栏时,画布高度按卡片竖向剩余空间封顶 —— 平板上卡片内容必须完整可见,禁止滚动。
  function fitH(){
    if (!window.matchMedia('(min-width:900px)').matches) return 0;
    var card = cv.parentElement; if (!card) return 0;
    var used = 0, kids = card.children;
    for (var i = 0; i < kids.length; i++){ if (kids[i] !== cv) used += kids[i].offsetHeight; }
    var cs = getComputedStyle(card);
    var lim = card.clientHeight - used - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 10;
    if (card.querySelector('.slot') && !card.querySelector('.slot.on')) lim -= 80;
    return lim > 200 ? lim : 0;
  }
  function layout(){
    var w = Math.max(cv.clientWidth || 340, 260);
    var h = Math.round(Math.min(Math.max(w * 0.80, 250), 400));
    var cap = fitH(); if (cap) h = Math.min(h, Math.round(cap));
    var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    W = w; H = h; unit = w / 12; ox = w / 2; oy = h / 2;
  }
  function px(x){ return ox + x * unit; }
  function py(y){ return oy - y * unit; }
  function yTop(){ return (H / 2) / unit; }
  function num(v, d){ return v.toFixed(d === undefined ? 1 : d); }

  /* ══════════ 巡航脚本:课堂投屏直接放的那条故事线 ══════════ */
  // 段内线性插值只改 target,current 再缓动一层 → 双重平滑;末帧回到首帧,循环无缝。
  var SCRIPT = [
    { t:0.0,  k:1.0,  b:0.0,  stage:1 },
    { t:2.6,  k:2.0,  b:0.0,  stage:1 },   // 只动 k:变陡
    { t:6.0,  k:-2.0, b:0.0,  stage:1 },   // 扫过 0:翻向右下
    { t:8.2,  k:1.6,  b:0.0,  stage:2 },   // 回正,放出台阶标注
    { t:10.8, k:1.6,  b:3.0,  stage:2 },   // 只动 b:平行上移
    { t:13.4, k:1.6,  b:-2.5, stage:2 },   // 只动 b:平行下移
    { t:15.6, k:1.6,  b:0.0,  stage:3 },   // 出解析式
    { t:18.0, k:0.6,  b:1.5,  stage:3 },   // 两个一起动
    { t:20.4, k:1.0,  b:0.0,  stage:1 }
  ];
  var CYCLE = SCRIPT[SCRIPT.length - 1].t;

  function cruise(dt){
    if (!play.on) return;
    play.t += dt;
    if (play.t >= CYCLE) play.t -= CYCLE;
    var i = 0;
    while (i < SCRIPT.length - 2 && SCRIPT[i + 1].t <= play.t) i++;
    var s0 = SCRIPT[i], s1 = SCRIPT[i + 1];
    var u = smoothstep((play.t - s0.t) / (s1.t - s0.t));
    var nk = s0.k + (s1.k - s0.k) * u, nb = s0.b + (s1.b - s0.b) * u;
    // 字幕跟着「此刻正在动的那个参数」走。
    var dk = Math.abs(nk - tgt.k), db = Math.abs(nb - tgt.b);
    if (dk > db + 1e-5) focus = 'k'; else if (db > dk + 1e-5) focus = 'b';
    tgt.k = nk; tgt.b = nb; tgt.stage = s0.stage;
  }

  function settle(dt){
    var base = boost > 0 ? K_SNAP : K_SMOOTH;
    if (boost > 0) boost = Math.max(0, boost - dt);
    cur.k = approach(cur.k, tgt.k, dt, drag.key === 'k' ? K_GRAB : base);
    cur.b = approach(cur.b, tgt.b, dt, drag.key === 'b' ? K_GRAB : base);
    cur.a2 = approach(cur.a2, tgt.stage >= 2 ? 1 : 0, dt, base);
    cur.a3 = approach(cur.a3, tgt.stage >= 3 ? 1 : 0, dt, base);
    // 「右 1 格」的行走标记:阶段 2 起持续巡游,把 k 读成一个可数的抬升动作。
    cur.walk += dt * 0.42;
    if (cur.walk > 1) cur.walk -= 1;
  }

  /* ══════════ 绘制:全部读 current,不读 target ══════════ */
  function drawGrid(){
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = COL.sheet; ctx.fillRect(0, 0, W, H);
    ctx.lineWidth = 1; ctx.strokeStyle = COL.grid;
    ctx.beginPath();
    for (var i = -6; i <= 6; i++){ ctx.moveTo(px(i), 0); ctx.lineTo(px(i), H); }
    var t = Math.ceil(yTop());
    for (var j = -t; j <= t; j++){ ctx.moveTo(0, py(j)); ctx.lineTo(W, py(j)); }
    ctx.stroke();

    ctx.strokeStyle = COL.axis; ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(0, py(0)); ctx.lineTo(W, py(0));
    ctx.moveTo(px(0), 0); ctx.lineTo(px(0), H);
    ctx.stroke();
    ctx.fillStyle = COL.ink3; ctx.font = '600 11px ' + MONO;
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    for (var m = -5; m <= 5; m++){
      if (m === 0) continue;
      ctx.fillText(String(m), px(m), py(0) + 4);
    }
    ctx.textAlign = 'left';
    ctx.fillText('x', W - 12, py(0) + 4);
    ctx.fillText('y', px(0) + 5, 3);
  }

  function drawLine(){
    var k = cur.k, b = cur.b;
    ctx.strokeStyle = COL.a; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(px(-6), py(k * -6 + b));
    ctx.lineTo(px(6), py(k * 6 + b));
    ctx.stroke();
  }

  // 阶段 2:截距点 + 「右 1 格、抬 k 格」的台阶,alpha 由双轨缓动喂进来。
  function drawStep(alpha){
    var k = cur.k, b = cur.b;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.setLineDash([5, 4]); ctx.lineWidth = 1.6; ctx.strokeStyle = COL.cc;
    ctx.beginPath();
    ctx.moveTo(px(0), py(b)); ctx.lineTo(px(1), py(b));
    ctx.lineTo(px(1), py(k + b));
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = COL.cc; ctx.font = '700 12px ' + MONO;
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText('Δx=1', px(0.5), py(b) + 3);
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('Δy=' + num(k), px(1) + 6, py(b + k / 2));

    // 行走标记:x 从 0 走到 1,竖线实时显示这一步抬了多少。
    var wx = cur.walk, fade = Math.sin(Math.PI * wx);
    ctx.globalAlpha = alpha * fade * 0.9;
    ctx.strokeStyle = COL.cc; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(px(wx), py(b)); ctx.lineTo(px(wx), py(k * wx + b));
    ctx.stroke();
    ctx.beginPath(); ctx.arc(px(wx), py(k * wx + b), 3.4, 0, Math.PI * 2);
    ctx.fillStyle = COL.cc; ctx.fill();

    ctx.globalAlpha = alpha;
    ctx.fillStyle = COL.b;
    ctx.beginPath(); ctx.arc(px(0), py(b), 5.5, 0, Math.PI * 2); ctx.fill();
    ctx.font = '700 12px ' + MONO; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    ctx.fillText('(0, ' + num(b) + ')', px(0) + 9, py(b) - 7);
    ctx.restore();
  }

  function draw(){
    drawGrid();
    drawLine();
    if (cur.a2 > 0.01) drawStep(cur.a2);
  }

  /* ══════════ 文字:只在内容变化时写 DOM ══════════ */
  var shown = { vk:'', vb:'', fb:'', eq:'', stage:'', hint:'', play:'' };
  function setText(el, key, text){
    if (shown[key] !== text){ shown[key] = text; el.textContent = text; }
  }
  function setHTML(el, key, html){
    if (shown[key] !== html){ shown[key] = html; el.innerHTML = html; }
  }

  var HINTS = [
    '先只管 k:向右拖,看直线怎么动。',
    '看虚线台阶:往右 1 格,直线抬起 Δy 格,那就是 k。现在也试试拖 b。',
    '两个参数一起看:k 管倾斜,b 管上下,互不干扰。'
  ];

  function feedbackHTML(){
    var k = cur.k, b = cur.b;
    if (focus === 'k'){
      if (Math.abs(k) < 0.05){
        return '<b>k = 0</b> 时图象成了一条水平线,y 不再随 x 变 —— 一次函数要求 k ≠ 0,' +
               '往左或往右挪一点再看。';
      }
      if (k > 0){
        return '<b>k = ' + num(k) + '</b> 是正数:x 每往右 1 格,y 就抬 ' + num(k) +
               ' 格,所以 y 随 x 增大而增大。刚才这一路,直线始终穿过 (0, ' + num(b) + ')。';
      }
      return '<b>k = ' + num(k) + '</b> 是负数:x 每往右 1 格,y 反而降 ' + num(-k) +
             ' 格,所以 y 随 x 增大而减小。直线还是穿过 (0, ' + num(b) + ') 那一点。';
    }
    return '<b>b = ' + num(b) + '</b>:直线与 y 轴交在 (0, ' + num(b) +
           ')。它是纵轴上的交点,不是与 x 轴的交点。整条线只是平行搬了个家,倾斜程度没变。';
  }

  function equationHTML(){
    var k = cur.k, b = cur.b;
    var sign = b < 0 ? ' − ' : ' + ';
    var trend = Math.abs(k) < 0.05 ? '（k = 0,此时不是一次函数）'
      : (k > 0 ? 'k > 0:y 随 x 增大而增大' : 'k < 0:y 随 x 增大而减小');
    return 'y = ' + num(k) + 'x' + sign + num(Math.abs(b)) +
      '<small>' + trend + '　·　直线与 y 轴交点 (0, ' + num(b) + ')</small>';
  }

  var textClock = 0;
  function syncUI(dt){
    setText(vk, 'vk', num(cur.k));
    setText(vb, 'vb', num(cur.b));
    setText(stageEl, 'stage', '阶段 ' + tgt.stage + ' / 3');
    setText(hint, 'hint', HINTS[tgt.stage - 1]);
    setText(btnPlay, 'play', play.on ? '暂停演示' : '播放演示');
    if (btnNext.disabled !== (tgt.stage >= 3)) btnNext.disabled = tgt.stage >= 3;
    if (eqSlot.classList.contains('on') !== (tgt.stage >= 3)) eqSlot.classList.toggle('on', tgt.stage >= 3);
    // 反馈与解析式每 0.12 秒一次:数值在动,但不必每帧改 DOM。
    textClock += dt;
    if (textClock >= 0.12){
      textClock = 0;
      setHTML(fb, 'fb', feedbackHTML());
      if (tgt.stage >= 3) setHTML(eq, 'eq', equationHTML());
    }
    if (play.on || boost > 0){
      if (Math.abs(parseFloat(sk.value) - cur.k) > 0.006) sk.value = String(Math.round(cur.k * 100) / 100);
      if (Math.abs(parseFloat(sb.value) - cur.b) > 0.03) sb.value = String(Math.round(cur.b * 20) / 20);
    }
  }

  /* ══════════ 唯一的主循环 ══════════ */
  var loop = { last:0, id:0 };
  function frame(now){
    // dt 夹到 50ms:标签页切回来、断点续跑都不会让画面瞬移。
    var dtms = loop.last ? Math.min(now - loop.last, 50) : 16.7;
    loop.last = now;
    var dt = dtms / 1000;
    cruise(dt);
    settle(dt);
    draw();
    syncUI(dt);
    loop.id = requestAnimationFrame(frame);
  }

  /* ══════════ 事件:只改 target,不画 ══════════ */
  function takeOver(){ if (play.on){ play.on = false; } }

  sk.addEventListener('pointerdown', function(){ takeOver(); drag.key = 'k'; });
  sb.addEventListener('pointerdown', function(){ takeOver(); drag.key = 'b'; });
  function endSlider(){ drag.key = null; }
  window.addEventListener('pointerup', endSlider);
  window.addEventListener('pointercancel', endSlider);

  sk.addEventListener('input', function(){
    takeOver(); focus = 'k'; drag.key = 'k'; tgt.k = parseFloat(sk.value);
  });
  sb.addEventListener('input', function(){
    takeOver(); focus = 'b'; drag.key = 'b'; tgt.b = parseFloat(sb.value);
  });
  sk.addEventListener('change', endSlider);
  sb.addEventListener('change', endSlider);

  btnPlay.addEventListener('click', function(){ play.on = !play.on; });
  btnNext.addEventListener('click', function(){
    takeOver();
    if (tgt.stage < 3) tgt.stage++;
  });
  btnReset.addEventListener('click', function(){
    play.on = false; play.t = 0; drag.key = null;
    tgt.k = K0; tgt.b = B0; tgt.stage = 1; focus = 'k';
    boost = 0.55;   // 快速回摆,不闪回
  });
  window.addEventListener('resize', layout);

  // smoke 桩(tools/smoke-animations.mjs)用的只读探针:导出当前帧的 current 值。
  window.__kpProbe = function(){
    return { playing:play.on, stage:tgt.stage, grab:null,
      vals:{ k:cur.k, b:cur.b, a2:cur.a2 } };
  };

  layout();
  loop.id = requestAnimationFrame(frame);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<!--
════════════════ PRD · 勾股定理面积对账 ════════════════
EVAL:动态收益 5(「两小块拼成一大块」是面积关系,静态图只能给一组数据,
      看不出「换一组还成立」)
      交互必要性 5(学生必须自己换直角边,才会相信这不是凑巧的一组数)
      合计 10 → 通过

一句话定位:
  两条直角边上的正方形面积加起来,永远等于斜边上正方形的面积。

核心误区:
  学生把 a²+b²=c² 当成一句要背的口诀,以为「3、4、5」是特例;
  也常忘记 c 必须是斜边(最长边)。

单一认知动作:
  分解 —— 把斜边上的大正方形面积拆成两个小正方形。本页不做逆定理判定、不做解直角三角形。

交互流程:
  1) 拖右侧圆点向右 → 直角边 a 变长 → a 的正方形跟着长大,斜边和大正方形同步重画;
  2) 拖上方圆点向上 → 直角边 b 变长 → b 的正方形长大;
  3) 每拖一次,三个面积数字同时更新,对账行立刻显示 a²+b² 与 c² 相等。

分步揭示设计:
  阶段 1:只有直角三角形和三个正方形(方格底),两个可拖圆点。没有任何数字。
  阶段 2:每个正方形中间写出面积,下方出现「a² + b² ⇔ c²」的对账行。
  阶段 3:标出 a、b、c 三条边,写出 a² + b² = c²。

概念反馈文案:
  - 「a = 3.00、b = 4.00:9.00 + 16.00 = 25.00,大正方形正好 25.00。」
  - 「你已经换了好几组直角边,两个小正方形的面积之和一直等于大正方形 —— 这就是勾股定理。」
  - 「注意大正方形一直贴在最长的那条边上:c 是斜边,不能拿直角边去当 c。」

运动设计(引擎 v2):
  常驻 rAF 主循环;a / b / 阶段透明度双轨缓动,拖拽跟手(连续量,不吸附),
  松手后才缓动归位到 0.25 的整档。巡航脚本:先只拉长 a → 再压短 b → 回到 3·4 停一拍
  读 9+16=25 → 换成 4.5·6 再换成小三角形,证明换几组都成立。
  阶段 2 起有一枚「对账指针」沿 a 方、b 方、c 方三个正方形的边界依次巡游,
  把「两小块 ⇔ 一大块」走成一个可看的动作。
════════════════════════════════════════════════════
-->

<style>

     color:var(--ink-2);border:1px solid var(--rule)}

      box-shadow:var(--shade);padding:11px;margin:0 0 11px}
canvas{display:block;width:100%;height:auto;touch-action:none;border-radius:var(--r-sm)}

button{font-family:var(--font);font-size:13.5px;min-height:var(--tap);padding:0 15px;
       border-radius:var(--r-sm);border:1px solid var(--rule);background:var(--sheet-sub);
       color:var(--ink-1);cursor:pointer;transition:background-color .2s ease,color .2s ease}

            min-width:106px}

          color:var(--ink-2);margin-top:3px}

/* 宽屏两栏(平板横屏单屏收纳):画布卡锁左、反馈卡在右,整页 100dvh 不滚动;≤900px 维持原单列。 */

  .wrap > h1{grid-column:1/-1;margin:0 0 2px}

  body{overflow:hidden}
  .wrap > .card{grid-row:4;margin:0;min-height:0;overflow:hidden}

<body>
<main class="wrap">
  <h1>勾股定理面积对账</h1>
  <p class="lead">按「播放演示」看一遍,或者自己拖图上两个圆点改变直角边,盯住三个正方形的面积。</p>
  <div class="tags">
    <span class="tag">初中 · 勾股定理</span>
    <span class="tag">认知动作:分解</span>
    <span class="tag">难度:中</span>
  </div>

  <section class="card">
    <canvas id="cv" width="340" height="340" aria-label="直角三角形与三条边上的正方形"></canvas>
    <p class="hint" id="hint">拖右边那个点(改 a)和上面那个点(改 b),先只看形状。</p>
    <div class="bar">
      <button id="play" class="play" type="button">播放演示</button>
      <button id="next" class="go" type="button">下一步</button>
      <button id="reset" type="button">重置</button>
      <span class="step" id="stage">阶段 1 / 3</span>
    </div>
    <div class="slot" id="ledgerSlot"><div class="ledger" id="ledger"></div></div>
  </section>

  <section class="card">
    <div class="fb" id="fb">先随手拖两下,或者按播放让它自己换几组直角边。</div>
    <div class="slot" id="eqSlot"><div class="eq" id="eq"></div></div>
  </section>
</main>

<script>
(function(){
  'use strict';
  var CS = getComputedStyle(document.documentElement);
  function c(n){ return CS.getPropertyValue(n).trim(); }
  var COL = {
    grid:c('--grid'), axis:c('--axis'), sheet:c('--sheet'), sub:c('--sheet-sub'),
    ink1:c('--ink-1'), ink2:c('--ink-2'), ink3:c('--ink-3'),
    a:c('--hi-a'), aSoft:c('--hi-a-soft'),
    b:c('--hi-b'), bSoft:c('--hi-b-soft'),
    cc:c('--hi-c'), ccSoft:c('--hi-c-soft')
  };
  var MONO = c('--mono');
  var TAU = Math.PI * 2;

  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var hint = document.getElementById('hint'), stageEl = document.getElementById('stage');
  var ledger = document.getElementById('ledger'), ledgerSlot = document.getElementById('ledgerSlot');
  var fb = document.getElementById('fb');
  var eq = document.getElementById('eq'), eqSlot = document.getElementById('eqSlot');
  var btnPlay = document.getElementById('play');
  var btnNext = document.getElementById('next'), btnReset = document.getElementById('reset');

  /* ══════════ 运动引擎:双轨状态 + 常驻主循环 ══════════ */
  // k 是「每 1/60 秒还剩多少差距」:越小越快。SMOOTH 常规,GRAB 拖拽跟手,SNAP 重置回摆。
  var K_SMOOTH = 0.90, K_GRAB = 0.55, K_SNAP = 0.78;
  function approach(now, want, dt, kk){
    return now + (want - now) * (1 - Math.pow(kk, dt * 60));
  }
  function clamp(v, lo, hi){ return v < lo ? lo : (v > hi ? hi : v); }
  function smoothstep(u){ u = clamp(u, 0, 1); return u * u * (3 - 2 * u); }

  var A0 = 3, B0 = 4, MIN = 1.5, MAX = 6;
  // target = 交互与巡航写入的目标;current = 画面上真正在用的值,每帧向 target 缓动。
  var tgt = { a:A0, b:B0, stage:1 };
  var cur = { a:A0, b:B0, a2:0, a3:0, scan:0 };
  var play = { on:false, t:0, seg:0 };
  var drag = { key:null };
  var moves = 0, boost = 0;

  // 世界窗口固定不动:拖动时比例尺不变,「面积变大」才是真的变大。
  var VX0 = -6.6, VX1 = 12.4, W = 340, H = 340, unit = 18, pad = 0;
  // 宽屏两栏时,画布边长按卡片竖向剩余空间封顶 —— 平板上卡片内容必须完整可见,禁止滚动。
  function fitH(){
    if (!window.matchMedia('(min-width:900px)').matches) return 0;
    var card = cv.parentElement; if (!card) return 0;
    var used = 0, kids = card.children;
    for (var i = 0; i < kids.length; i++){ if (kids[i] !== cv) used += kids[i].offsetHeight; }
    var cs = getComputedStyle(card);
    var lim = card.clientHeight - used - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 10;
    if (card.querySelector('.slot') && !card.querySelector('.slot.on')) lim -= 80;
    return lim > 200 ? lim : 0;
  }
  function layout(){
    // 宽度从卡片量(画布显示宽可能被 style.width 收窄,不能再从自身量)
    var card = cv.parentElement;
    var cs0 = card ? getComputedStyle(card) : null;
    var wAvail = card
      ? card.clientWidth - parseFloat(cs0.paddingLeft) - parseFloat(cs0.paddingRight)
      : (cv.clientWidth || 320);
    var w = Math.max(wAvail, 250);
    // 正方形画布:边长受宽、高双向约束;显示尺寸与逻辑尺寸严格一致,不歪曲拖拽命中
    var cap = fitH();
    var s = cap ? Math.min(w, Math.round(cap)) : w;
    cv.style.width = s + 'px'; cv.style.height = s + 'px'; cv.style.margin = '0 auto';
    var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    W = s; H = s;
    cv.width = Math.round(s * dpr); cv.height = Math.round(s * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    unit = W / (VX1 - VX0);
    pad = -VX0 * unit;
  }
  function px(x){ return pad + x * unit; }
  function py(y){ return H - pad - y * unit; }
  function wx(sx){ return (sx - pad) / unit; }
  function wy(sy){ return (H - pad - sy) / unit; }
  function n2(v){ return v.toFixed(2); }

  /* ══════════ 巡航脚本:课堂投屏直接放的那条故事线 ══════════ */
  var SCRIPT = [
    { t:0.0,  a:3.0, b:4.0, stage:1 },
    { t:3.0,  a:5.5, b:4.0, stage:1 },   // 只拉长 a
    { t:5.6,  a:5.5, b:2.0, stage:1 },   // 只压短 b
    { t:8.2,  a:3.0, b:4.0, stage:2 },   // 回到 3·4,放出面积数字
    { t:10.2, a:3.0, b:4.0, stage:2 },   // 停一拍:9 + 16 = 25
    { t:13.0, a:4.5, b:6.0, stage:3 },   // 换一组,关系照旧
    { t:15.8, a:2.0, b:2.6, stage:3 },   // 再换成小三角形
    { t:18.4, a:3.0, b:4.0, stage:1 }
  ];
  var CYCLE = SCRIPT[SCRIPT.length - 1].t;

  function cruise(dt){
    if (!play.on) return;
    play.t += dt;
    if (play.t >= CYCLE) play.t -= CYCLE;
    var i = 0;
    while (i < SCRIPT.length - 2 && SCRIPT[i + 1].t <= play.t) i++;
    if (i !== play.seg){ play.seg = i; moves++; }   // 每换一段就是「换了一组直角边」
    var s0 = SCRIPT[i], s1 = SCRIPT[i + 1];
    var u = smoothstep((play.t - s0.t) / (s1.t - s0.t));
    tgt.a = s0.a + (s1.a - s0.a) * u;
    tgt.b = s0.b + (s1.b - s0.b) * u;
    tgt.stage = s0.stage;
  }

  function settle(dt){
    var base = boost > 0 ? K_SNAP : K_SMOOTH;
    if (boost > 0) boost = Math.max(0, boost - dt);
    cur.a = approach(cur.a, tgt.a, dt, drag.key === 'a' ? K_GRAB : base);
    cur.b = approach(cur.b, tgt.b, dt, drag.key === 'b' ? K_GRAB : base);
    cur.a2 = approach(cur.a2, tgt.stage >= 2 ? 1 : 0, dt, base);
    cur.a3 = approach(cur.a3, tgt.stage >= 3 ? 1 : 0, dt, base);
    // 对账指针:0→1 走 a 方的边,1→2 走 b 方的边,2→3 走 c 方的边,循环。
    cur.scan += dt * 0.34;
    if (cur.scan >= 3) cur.scan -= 3;
  }

  /* ══════════ 绘制:全部读 current,不读 target ══════════ */
  function geom(){
    var a = cur.a, b = cur.b;
    var cLen = Math.sqrt(a * a + b * b);
    // 斜边正方形:把向量 AB 顺时针转 90° 得到向外的方向 (b, a)。
    return {
      a:a, b:b, c:cLen,
      sqA:[[0, 0], [a, 0], [a, -a], [0, -a]],
      sqB:[[0, 0], [0, b], [-b, b], [-b, 0]],
      sqC:[[a, 0], [0, b], [b, b + a], [a + b, a]],
      tri:[[0, 0], [a, 0], [0, b]]
    };
  }

  function poly(pts, fill, stroke, lw){
    ctx.beginPath();
    ctx.moveTo(px(pts[0][0]), py(pts[0][1]));
    for (var i = 1; i < pts.length; i++) ctx.lineTo(px(pts[i][0]), py(pts[i][1]));
    ctx.closePath();
    if (fill){ ctx.fillStyle = fill; ctx.fill(); }
    if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
  }
  function label(text, x, y, color, size, alpha){
    ctx.save();
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.fillStyle = color; ctx.font = '700 ' + (size || 12) + 'px ' + MONO;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, px(x), py(y));
    ctx.restore();
  }

  function drawGrid(){
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = COL.sheet; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = COL.grid; ctx.lineWidth = 1;
    ctx.beginPath();
    for (var i = Math.ceil(VX0); i <= VX1; i++){
      ctx.moveTo(px(i), 0); ctx.lineTo(px(i), H);
      ctx.moveTo(0, py(i)); ctx.lineTo(W, py(i));
    }
    ctx.stroke();
  }

  function drawHandle(x, y, color, lifted){
    var r = 8 + lifted * 1.6;
    ctx.beginPath(); ctx.arc(px(x), py(y), r + 3, 0, TAU);
    ctx.fillStyle = COL.sheet; ctx.fill();
    ctx.beginPath(); ctx.arc(px(x), py(y), r, 0, TAU);
    ctx.fillStyle = color; ctx.fill();
    ctx.strokeStyle = COL.sheet; ctx.lineWidth = 2; ctx.stroke();
  }

  // 对账指针:沿某个正方形的四条边匀速走一圈。
  function onPerimeter(pts, u){
    var seg = Math.floor(u * 4) % 4, f = u * 4 - Math.floor(u * 4);
    var p0 = pts[seg], p1 = pts[(seg + 1) % 4];
    return [p0[0] + (p1[0] - p0[0]) * f, p0[1] + (p1[1] - p0[1]) * f];
  }
  function drawScan(g, alpha){
    var which = Math.floor(cur.scan), u = cur.scan - which;
    var box = which === 0 ? g.sqA : (which === 1 ? g.sqB : g.sqC);
    var color = which === 0 ? COL.a : (which === 1 ? COL.b : COL.cc);
    ctx.save();
    ctx.globalAlpha = alpha * (0.35 + 0.65 * Math.sin(Math.PI * Math.min(u * 1.6, 1)));
    ctx.strokeStyle = color; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
    ctx.beginPath();
    for (var i = 0; i <= 14; i++){
      var q = onPerimeter(box, (u + (i - 14) * 0.008 + 1) % 1);
      if (i === 0) ctx.moveTo(px(q[0]), py(q[1])); else ctx.lineTo(px(q[0]), py(q[1]));
    }
    ctx.stroke();
    var head = onPerimeter(box, u);
    ctx.beginPath(); ctx.arc(px(head[0]), py(head[1]), 4, 0, TAU);
    ctx.fillStyle = color; ctx.fill();
    ctx.restore();
  }

  function draw(){
    var g = geom();
    drawGrid();
    poly(g.sqA, COL.aSoft, COL.a, 2);
    poly(g.sqB, COL.bSoft, COL.b, 2);
    poly(g.sqC, COL.ccSoft, COL.cc, 2);
    poly(g.tri, COL.sub, COL.ink2, 2.2);

    // 直角记号
    ctx.strokeStyle = COL.ink2; ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(px(0.45), py(0)); ctx.lineTo(px(0.45), py(0.45)); ctx.lineTo(px(0), py(0.45));
    ctx.stroke();

    if (cur.a2 > 0.01){
      drawScan(g, cur.a2);
      label(n2(g.a * g.a), g.a / 2, -g.a / 2, COL.a, g.a > 2.4 ? 13 : 11, cur.a2);
      label(n2(g.b * g.b), -g.b / 2, g.b / 2, COL.b, g.b > 2.4 ? 13 : 11, cur.a2);
      label(n2(g.c * g.c), (g.a + g.b) / 2, (g.a + g.b) / 2, COL.cc, 13, cur.a2);
    }
    if (cur.a3 > 0.01){
      // 斜边标签沿外法线 (b, a)/c 推出去一点,避免压在斜边上。
      var nx = g.b / g.c, ny = g.a / g.c;
      label('a=' + n2(g.a), g.a / 2, 0.38, COL.a, 12, cur.a3);
      label('b=' + n2(g.b), 0.6, g.b / 2, COL.b, 12, cur.a3);
      label('c=' + n2(g.c), g.a / 2 + nx * 0.62, g.b / 2 + ny * 0.62, COL.cc, 12, cur.a3);
    }

    drawHandle(g.a, 0, COL.a, drag.key === 'a' ? 1 : 0);
    drawHandle(0, g.b, COL.b, drag.key === 'b' ? 1 : 0);
  }

  /* ══════════ 文字:只在内容变化时写 DOM ══════════ */
  var shown = { stage:'', hint:'', play:'', ledger:'', fb:'', eq:'' };
  function setText(el, key, text){
    if (shown[key] !== text){ shown[key] = text; el.textContent = text; }
  }
  function setHTML(el, key, html){
    if (shown[key] !== html){ shown[key] = html; el.innerHTML = html; }
  }

  var HINTS = [
    '拖右边那个点(改 a)和上面那个点(改 b),先只看形状。',
    '现在每个正方形里有面积数字了,一边拖一边读下面的对账行。',
    '三条边都标出来了,对着数字读一遍下面那行式子。'
  ];

  function ledgerHTML(){
    var g = geom(), sum = g.a * g.a + g.b * g.b;
    return '<div class="la"><span>a 上的正方形　a²</span><span>' + n2(g.a * g.a) + '</span></div>' +
      '<div class="lb"><span>b 上的正方形　b²</span><span>' + n2(g.b * g.b) + '</span></div>' +
      '<div class="sum"><span>两个小的加起来</span><span>' + n2(sum) + '</span></div>' +
      '<div class="lc sum"><span>c 上的大正方形　c²</span><span>' + n2(g.c * g.c) + '</span></div>';
  }

  function feedbackHTML(){
    var g = geom(), sum = g.a * g.a + g.b * g.b, msg;
    if (moves < 3){
      msg = 'a = <b>' + n2(g.a) + '</b>、b = <b>' + n2(g.b) + '</b>:两个小正方形是 ' +
            n2(g.a * g.a) + ' 和 ' + n2(g.b * g.b) + ',加起来 <b>' + n2(sum) +
            '</b>;斜边上的大正方形也是 <b>' + n2(g.c * g.c) + '</b>。';
    } else {
      msg = '你已经换了 ' + moves + ' 组直角边,两个小正方形的面积之和一直等于大正方形(现在是 <b>' +
            n2(sum) + '</b>)。变的是三条边长,不变的是这个面积关系 —— 这就是勾股定理。';
    }
    if (tgt.stage >= 3){
      msg += ' 大正方形始终贴在最长的那条边上:c 是斜边,别拿直角边当 c。';
    }
    return msg;
  }

  function equationHTML(){
    var g = geom();
    return 'a² + b² = ' + n2(g.a * g.a) + ' + ' + n2(g.b * g.b) + ' = ' +
      n2(g.c * g.c) + ' = c²<small>直角三角形里,两条直角边的平方和等于斜边的平方。</small>';
  }

  var textClock = 0;
  function syncUI(dt){
    setText(stageEl, 'stage', '阶段 ' + tgt.stage + ' / 3');
    setText(hint, 'hint', HINTS[tgt.stage - 1]);
    setText(btnPlay, 'play', play.on ? '暂停演示' : '播放演示');
    if (btnNext.disabled !== (tgt.stage >= 3)) btnNext.disabled = tgt.stage >= 3;
    if (ledgerSlot.classList.contains('on') !== (tgt.stage >= 2)) ledgerSlot.classList.toggle('on', tgt.stage >= 2);
    if (eqSlot.classList.contains('on') !== (tgt.stage >= 3)) eqSlot.classList.toggle('on', tgt.stage >= 3);
    // 数值在动,但不必每帧改 DOM:0.12 秒一次够读了。
    textClock += dt;
    if (textClock >= 0.12){
      textClock = 0;
      setHTML(fb, 'fb', feedbackHTML());
      if (tgt.stage >= 2) setHTML(ledger, 'ledger', ledgerHTML());
      if (tgt.stage >= 3) setHTML(eq, 'eq', equationHTML());
    }
  }

  /* ══════════ 唯一的主循环 ══════════ */
  var loop = { last:0, id:0 };
  function frame(now){
    // dt 夹到 50ms:标签页切回来、断点续跑都不会让画面瞬移。
    var dtms = loop.last ? Math.min(now - loop.last, 50) : 16.7;
    loop.last = now;
    var dt = dtms / 1000;
    cruise(dt);
    settle(dt);
    draw();
    syncUI(dt);
    loop.id = requestAnimationFrame(frame);
  }

  /* ══════════ 事件:只改 target,不画 ══════════ */
  function takeOver(){ if (play.on){ play.on = false; } }
  function local(ev){
    var r = cv.getBoundingClientRect();
    return [ev.clientX - r.left, ev.clientY - r.top];
  }
  function hit(sx, sy){
    var R = 26;
    var da = Math.hypot(sx - px(cur.a), sy - py(0));
    var db = Math.hypot(sx - px(0), sy - py(cur.b));
    if (da <= R && da <= db) return 'a';
    if (db <= R) return 'b';
    return null;
  }

  cv.addEventListener('pointerdown', function(ev){
    var p = local(ev);
    var k = hit(p[0], p[1]);
    if (k){
      takeOver();
      drag.key = k;
      cv.setPointerCapture(ev.pointerId);
      ev.preventDefault();
    }
  });
  cv.addEventListener('pointermove', function(ev){
    if (!drag.key) return;
    var p = local(ev);
    // 跟手:直接吃连续量,不在拖动过程里吸附档位。向右拖 = a 变长,向上拖 = b 变长。
    if (drag.key === 'a') tgt.a = clamp(wx(p[0]), MIN, MAX);
    else tgt.b = clamp(wy(p[1]), MIN, MAX);
    ev.preventDefault();
  });
  function endDrag(){
    if (!drag.key) return;
    // 松手才归位:吸到 0.25 的整档,靠缓动走过去,不闪。
    if (drag.key === 'a') tgt.a = clamp(Math.round(tgt.a * 4) / 4, MIN, MAX);
    else tgt.b = clamp(Math.round(tgt.b * 4) / 4, MIN, MAX);
    drag.key = null;
    moves++;
  }
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);

  btnPlay.addEventListener('click', function(){ play.on = !play.on; });
  btnNext.addEventListener('click', function(){
    takeOver();
    if (tgt.stage < 3) tgt.stage++;
  });
  btnReset.addEventListener('click', function(){
    play.on = false; play.t = 0; play.seg = 0; drag.key = null;
    tgt.a = A0; tgt.b = B0; tgt.stage = 1; moves = 0;
    boost = 0.55;   // 快速回摆,不闪回
  });
  window.addEventListener('resize', layout);

  // smoke 桩(tools/smoke-animations.mjs)用的只读探针:current 值 + 可拖点屏幕坐标。
  window.__kpProbe = function(){
    return { playing:play.on, stage:tgt.stage, grab:[px(cur.a), py(0)],
      vals:{ a:cur.a, b:cur.b, a2:cur.a2 } };
  };

  layout();
  loop.id = requestAnimationFrame(frame);
})();
</script>
</body>
</html>
